<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERI - Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_css/signup.css') }}">
</head>
<body>
    <div id="splashScreen">
        <img src="{{ url_for('static', filename='images/logo_without_bg.png')}}" alt="MERI logo" id="logo">
    </div>

    <script>
        const splashScreen = document.getElementById("splashScreen");
        const logo = document.getElementById("logo");
        setTimeout(()=>{
            splashScreen.classList.add("reveal");
            setTimeout(()=>{
                logo.classList.add("reveal");
            }, 550)
            

        }, 200)


    </script>
    
</body>
</html>
