<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERI-Welcome</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/dashboard/dashboard.css">
    <link rel="stylesheet" ref="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home" />
</head>
<body>
    <div id="mainScreen">
        <div id="logoContainer">
            <img src="/static/images/logo_without_bg.png" alt="MERI Logo">
        </div>
        <div id="welcomeContainer">
            <div id="welcomeCard">
                <p>Oct 22, 2026 | Thursday</p>
                <p>How's your day going?</p>
                <p>Renan</p>
            </div>
        </div>
        <div id="choicesContainer">
            <h2>Quick Access</h2>
            <div id="choicesFrame">
                <div class="function-choice" id="budgetTrackerContainer">Budget Tracker</div>
                <div class="function-choice" id="scheduleContainer">Schedule</div>
                <div class="function-choice" id="toDoListContainer">To do List</div>
                <div class="function-choice" id="reviewerContainer">Reviewer</div>
            </div>
        </div>
        <div id="navContainer">
            <nav></nav>
        </div>
    </div>
